<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Stellantis Spark Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #2f4858, #33658a); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            background: white; 
            padding: 40px; 
            width: 100%;
            max-width: 450px;
        }
        .btn-stellantis {
            background-color: #0d6efd;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-stellantis:hover {
            background-color: #0a58ca;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="login-card text-center animate__animated animate__fadeIn">
    <div class="mb-4">
        <span class="display-3">🏭</span>
        <h3 class="fw-bold text-dark mt-2">Stellantis Spark Engine</h3>
        <p class="text-muted small">Módulo de Control y Priorización de Patio</p>
    </div>

    <form action="/login_proceso" method="POST">
        <div class="mb-3 text-start">
            <label for="usuario" class="form-label small fw-bold text-secondary">Legajo / Usuario</label>
            <input type="text" class="form-control form-control-lg" id="usuario" name="username" placeholder="Ej: ST-5421" required>
        </div>
        
        <div class="mb-4 text-start">
            <label for="password" class="form-label small fw-bold text-secondary">Contraseña Corporativa</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-stellantis btn-lg w-100 py-2.5 shadow-sm">
            🔐 Validar Credenciales e Ingresar
        </button>
    </form>

    <div class="mt-4 border-top pt-3">
        <p class="text-muted small mb-0">Sistema Local de Optimización Logística v1.2</p>
    </div>
</div>

</body>
</html>
